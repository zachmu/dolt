name: Check deferred CI
description: Check PR deferral policy and cancel postponed workflows before setup or tests.
inputs:
  timezone:
    description: IANA timezone for the after-hours window.
    default: America/Los_Angeles
outputs:
  run:
    description: Whether subsequent work is admitted (also true for non-PR events).
    value: ${{ steps.admission.outputs.run }}
runs:
  using: composite
  steps:
    - id: admission
      uses: actions/github-script@v7
      env:
        CI_ACTION_PATH: ${{ github.action_path }}
        CI_TIMEZONE: ${{ inputs.timezone }}
      with:
        script: |
          const { admission } = require(process.env.CI_ACTION_PATH + '/../../scripts/ci-scheduling');
          const { marker, DEFERRED_NOTICE } = require(process.env.CI_ACTION_PATH + '/../../scripts/ci-scheduling/cancellation');
          const decision = await admission({ github, context, timezone: process.env.CI_TIMEZONE });
          core.setOutput('run', String(decision.run));
          if (decision.reason === 'deferred') core.notice(marker(context.runId, Number(process.env.GITHUB_RUN_ATTEMPT)), { title: DEFERRED_NOTICE });
    - if: steps.admission.outputs.run == 'false'
      uses: actions/github-script@v7
      env:
        CI_ACTION_PATH: ${{ github.action_path }}
      with:
        script: |
          const { cancelFromJob } = require(process.env.CI_ACTION_PATH + '/../../scripts/ci-scheduling/cancellation');
          await cancelFromJob({ github, context, core });
